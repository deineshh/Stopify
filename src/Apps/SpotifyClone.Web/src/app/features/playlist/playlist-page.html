@if (view(); as data) {
  <app-collection-layout
    [title]="data.title"
    [cover]="data.cover"
    [eyebrow]="data.isPublic ? 'Public Playlist' : 'Private Playlist'"
    [description]="data.description"
    [meta]="meta()"
    [editableCover]="isOwner()"
    [editable]="isOwner()"
    (edit)="dialogs.editDetails(ref()!)"
    [moreMenu]="isOwner() ? playlistMenu.template() : null"
    [moreMenuData]="ref"
    [showInvite]="isOwner()"
    [target]="{ kind: 'playlist', id: data.id }"
    [(shuffle)]="shuffle"
    [saved]="isOwner() ? null : saved()"
    (savedChange)="saved.set($event)"
  >
    @if (order()?.tracks?.length) {
      <app-track-table
        [tracks]="order()!.tracks"
        [context]="{ kind: 'playlist', id: data.id }"
        [menuPlaylist]="menuPlaylist()"
        [showDateAdded]="false"
        [reorderable]="canReorder()"
        (reorder)="reorder($event)"
      />
    } @else {
      <div class="playlist-page__empty">
        <p class="playlist-page__empty-title">This playlist doesn't have any songs yet.</p>
        @if (isOwner()) {
          <p class="playlist-page__empty-text">Find a song, open its menu (right-click or •••) and choose Add to playlist.</p>
        }
      </div>
    }
  </app-collection-layout>
} @else {
  <app-page-state thing="playlist" [loading]="playlist.isLoading()" [error]="playlist.error()" (retry)="playlist.reload()" />
}

<app-playlist-menu #playlistMenu />
