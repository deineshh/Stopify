@if (album.hasValue() ? album.value() : null; as data) {
  <app-collection-layout
    [title]="data.title"
    [cover]="data.cover"
    [eyebrow]="data.typeLabel"
    [meta]="meta()"
    [showViewAs]="false"
    [target]="{ kind: 'album', id: data.id }"
    [(shuffle)]="shuffle"
    [(saved)]="saved"
  >
    <app-track-table [tracks]="data.tracks" [context]="{ kind: 'album', id: data.id }" [showAlbum]="false" [showDateAdded]="false" />

    @if (data.releaseDate) {
      <div class="playlist-page__main-section--credits-group">
        <span class="playlist-page__main-section--date-text">{{ data.releaseDate | date: 'MMMM d, y' : 'UTC' }}</span>
      </div>
    }

    @if (data.moreBy; as shelf) {
      <app-media-shelf [shelf]="shelf" />
    }
  </app-collection-layout>
} @else {
  <app-page-state thing="album" [loading]="album.isLoading()" [error]="album.error()" (retry)="album.reload()" />
}
