@if (playlist.hasValue() ? playlist.value() : null; as data) {
  <app-collection-layout
    [title]="data.title"
    [cover]="data.cover"
    [eyebrow]="data.isPublic ? 'Public Playlist' : 'Private Playlist'"
    [description]="data.description"
    [meta]="meta()"
    [editableCover]="isOwner()"
    [showInvite]="isOwner()"
    [target]="{ kind: 'playlist', id: data.id }"
    [(shuffle)]="shuffle"
    [saved]="isOwner() ? null : saved()"
    (savedChange)="saved.set($event)"
  >
    @if (data.tracks.length) {
      <app-track-table [tracks]="data.tracks" [context]="{ kind: 'playlist', id: data.id }" [showDateAdded]="false" />
    } @else {
      <p class="playlist-page__empty">This playlist doesn't have any songs yet.</p>
    }
  </app-collection-layout>
} @else {
  <app-page-state thing="playlist" [loading]="playlist.isLoading()" [error]="playlist.error()" (retry)="playlist.reload()" />
}
